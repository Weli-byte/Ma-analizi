name: android-build
# Welliddia Android app (ADR 0098): a Trusted Web Activity around the live site, generated by Bubblewrap from android/twa-manifest.json and signed with the
# owner's UPLOAD key (Play App Signing: Google re-signs the store build with its own key). Output: the .aab for Play Console and a signed .apk for a direct
# test install. The keystore and its password come only from GitHub secrets; they are written to the runner's temp directory and never printed.
on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "versionCode (integer, must grow with every upload to Play Console)"
        required: true
        default: "1"
      version_name:
        description: "versionName shown to users"
        required: true
        default: "1.0.0"
  pull_request:
    paths:
      - "android/**"
      - ".github/workflows/android-build.yml"
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Bubblewrap (pinned)
        run: npm install -g @bubblewrap/cli@1.27.0
      - name: Bubblewrap configuration (runner JDK and Android SDK)
        run: |
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath": "%s", "androidSdkPath": "%s"}\n' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          # Bubblewrap 1.27 validates the SDK by a `tools/` or `bin/` folder and calls tools/bin/sdkmanager; the runner keeps them in cmdline-tools/latest
          [ -e "$ANDROID_HOME/tools" ] || ln -s "$ANDROID_HOME/cmdline-tools/latest" "$ANDROID_HOME/tools"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "build-tools;36.1.0" "platforms;android-36" > /dev/null
      - name: Version
        env:
          VC: ${{ inputs.version_code || '1' }}
          VN: ${{ inputs.version_name || '1.0.0' }}
        run: |
          case "$VC" in ''|*[!0-9]*) echo "::error::version_code must be an integer"; exit 1;; esac
          python3 - <<'EOF'
          import json, os
          p = "android/twa-manifest.json"
          m = json.load(open(p))
          m["appVersionCode"] = int(os.environ["VC"]); m["appVersionName"] = m["appVersion"] = os.environ["VN"]
          json.dump(m, open(p, "w"), indent=2)
          EOF
      - name: Upload key from the secrets (never printed)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [ -z "$KEYSTORE_B64" ]; then echo "::error::ANDROID_UPLOAD_KEYSTORE_B64 is not set"; exit 1; fi
          echo "$KEYSTORE_B64" | base64 -d > android/upload-keystore.p12
      - name: Generate the Android project and build
        working-directory: android
        env:
          BUBBLEWRAP_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          BUBBLEWRAP_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
        run: |
          bubblewrap update --skipVersionUpgrade --manifest twa-manifest.json
          bubblewrap build --skipPwaValidation --manifest twa-manifest.json
          rm -f upload-keystore.p12
          ls -la *.aab *.apk
      - name: Certificate of the signed build (public fingerprint only)
        working-directory: android
        run: |
          keytool -printcert -jarfile app-release-bundle.aab | grep -E "SHA256|Owner" || true
          grep -h -E "targetSdkVersion|compileSdkVersion|targetSdk |compileSdk " app/build.gradle | head -4 || true
      - uses: actions/upload-artifact@v4
        with:
          name: welliddia-android-${{ inputs.version_code || '1' }}
          path: |
            android/app-release-bundle.aab
            android/app-release-signed.apk
          retention-days: 30
