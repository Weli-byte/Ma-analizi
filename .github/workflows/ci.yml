name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.lock -e ".[dev]"
      - run: ruff check .
      - run: python -c "import src.schemas, src.config, src.versioning"
      - run: pytest
