name: experiments-lab
# Phase 3 sprint 17 ablation laboratory (ADR 0096). Builds the out-of-fold rows 2020-24 with expected goals and fit times (too heavy for the
# owner's PC), runs the pre-registered experiments once (specs are committed BEFORE this job computes anything; a spec whose hash changed or an
# experiment that already has a result is refused) and uploads the results. The final-test seasons are never downloaded. Nothing is promoted.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/experiments-lab.yml"
env:
  OMP_NUM_THREADS: "1"
  OPENBLAS_NUM_THREADS: "1"
  MKL_NUM_THREADS: "1"
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Private data repo access (repository-scoped deploy key, read only here)
        env:
          DEPLOY_KEY: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$DEPLOY_KEY" ]; then echo "::warning::SKIPPED_NOT_CONFIGURED: no deploy key; the live experiment will wait for data"; exit 0; fi
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/data_key && chmod 600 ~/.ssh/data_key
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python -c "import json,sys; [print('github.com', k) for k in json.load(sys.stdin)['ssh_keys']]" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host data-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/data_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          git remote add data git@data-repo:Weli-byte/Ma-analizi2.git
          git fetch --depth 1 data markets-data
          git worktree add --detach markets-data-wt FETCH_HEAD
      - name: Out-of-fold rows with expected goals (2020-21 to 2023-24)
        run: python -m src.experiments.lab build-oof --out lab/oof_rates.jsonl
      - name: Run the registered experiments once
        run: |
          MR=""; [ -d markets-data-wt ] && MR="--markets-root markets-data-wt"
          python -m src.experiments.lab run --oof-rates lab/oof_rates.jsonl $MR
          python -m src.experiments.lab report
          gzip -k lab/oof_rates.jsonl
      - uses: actions/upload-artifact@v4
        with:
          name: experiments-lab
          path: |
            docs/phase3/experiments
            docs/phase3/sprint17_report.md
            lab/oof_rates.jsonl.gz
          retention-days: 30
