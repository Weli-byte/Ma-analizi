name: markets-cloud
# Match intelligence without the owner's PC (ADR 0041/0042): downloads the official CSVs from GitHub's
# network (the owner's ISP blocks football-data.co.uk), rebuilds the dataset, ingests recent results,
# pulls the exact odds from the odds-data branch and writes immutable intelligence artifacts for the next
# fixtures. Artifacts go to the `markets-data` branch; the PC pulls them with
# `python -m src.markets.run --sync-remote`. Needs secret FOOTBALL_DATA_ORG_API_KEY.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch: {}
concurrency:
  group: markets-cloud
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  markets:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: "Dataset (official CSVs, research mode because the running season changes daily)"
        run: |
          python -m src.data.download
          python -m src.data.pipeline --mode research
      - name: Recent results and exact odds from the data branch
        run: |
          python -c "from pathlib import Path; from src.mlops.report import collect_results; print('new results:', collect_results(Path('.')))"
          python -m src.odds.run sync-remote
      - name: Check out the markets data branch (create it on the first run)
        run: |
          if git ls-remote --exit-code --heads origin markets-data >/dev/null 2>&1; then
            git fetch origin markets-data
            git worktree add -B markets-data markets-data-wt origin/markets-data
          else
            git worktree add --detach markets-data-wt
            cd markets-data-wt && git checkout --orphan markets-data && git rm -rf . -q
          fi
      - name: Intelligence for the next fixtures
        run: python -m src.markets.run --no-sync --force
      - name: Publish artifacts
        run: |
          mkdir -p markets-data-wt/artifacts
          cp -r artifacts/markets markets-data-wt/artifacts/
          rm -rf markets-data-wt/artifacts/markets/evaluation
          cd markets-data-wt
          git config user.name "markets bot"
          git config user.email "markets-bot@users.noreply.github.com"
          git add -A artifacts
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -q -m "markets: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:markets-data
          fi
