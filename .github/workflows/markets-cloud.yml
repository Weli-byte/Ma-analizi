name: markets-cloud
# Match intelligence without the owner's PC (ADR 0041/0042/0044): history and fixtures come from openfootball
# (public domain), the exact odds from the odds-data branch; writes immutable intelligence artifacts for the next
# fixtures. Artifacts go to the `markets-data` branch; the PC pulls them with
# `python -m src.markets.run --sync-remote`. No API key is needed.
on:
  schedule:
    - cron: "23 */4 * * *"
  workflow_dispatch: {}
concurrency:
  group: markets-cloud
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  markets:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATA_REPO_URL: git@data-repo:Weli-byte/Ma-analizi2.git
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
      API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
      FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      THE_ODDS_API_KEY_2: ${{ secrets.THE_ODDS_API_KEY_2 }}  # optional second free account (ADR 0059)
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}   # optional (ADR 0077): without them notify is a no-op
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Private data repo access (repository-scoped deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/data_key && chmod 600 ~/.ssh/data_key
          curl -fsS --retry 5 --retry-delay 5 --retry-all-errors -H "Authorization: Bearer $GH_TOKEN" https://api.github.com/meta | python -c "import json,sys; [print('github.com', k) for k in json.load(sys.stdin)['ssh_keys']]" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host data-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/data_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          git remote add data git@data-repo:Weli-byte/Ma-analizi2.git
      - name: Exact odds from the data branch (history and fixtures come from openfootball, public domain)
        run: python -m src.odds.run sync-remote
      - name: Check out the markets data branch (create it on the first run)
        run: |
          if git ls-remote --exit-code --heads data markets-data >/dev/null 2>&1; then
            git fetch data markets-data
            git worktree add -B markets-data markets-data-wt data/markets-data
          else
            git worktree add --detach markets-data-wt
            cd markets-data-wt && git checkout --orphan markets-data && git rm -rf . -q
          fi
      - name: Restore the artifacts published earlier (the track record needs them)
        run: |
          mkdir -p artifacts
          cp -r markets-data-wt/artifacts/markets artifacts/ 2>/dev/null || true
          cp -r markets-data-wt/artifacts/stats artifacts/ 2>/dev/null || true
          cp -r markets-data-wt/artifacts/injuries artifacts/ 2>/dev/null || true
          cp -r markets-data-wt/artifacts/results artifacts/ 2>/dev/null || true
          cp -r markets-data-wt/artifacts/crests artifacts/ 2>/dev/null || true
      - name: Shadow gate verdict from the shadow-data branch (ADR 0076; shown on the track page, evidence only)
        run: |
          if git ls-remote --exit-code --heads data shadow-data >/dev/null 2>&1; then
            git fetch -q data shadow-data
            git show FETCH_HEAD:artifacts/league_models/rollout/shadow_gate.json > artifacts/markets/shadow_gate.json 2>/dev/null || rm -f artifacts/markets/shadow_gate.json
            # dead-man switch: the shadow job cannot report its own death, this job can (the shadow job stamps shadow_gate.json on every run; older than 6 hours = stalled)
            python -m src.mlops.notify --watchdog artifacts/markets/shadow_gate.json --max-hours 6 --label "Gölge işi" --state artifacts/markets/notified_watchdog.json || true
          fi
      - name: Match statistics (Highlightly, within the daily request budget)
        run: python -m src.markets.stats_collect
      - name: Results the open history does not have yet (ADR 0058)
        run: python -m src.markets.live_results
      - name: Europa / Conference League 2025-26 results from ESPN, once (ADR 0074; a marker in the stored results makes later runs a no-op)
        run: python -m src.markets.espn_backfill --if-needed
      - name: Injuries and suspensions (information only, never in a probability; ADR 0057)
        run: python -m src.markets.injuries
      - name: Intelligence for the next fixtures
        run: python -m src.markets.run --no-sync --force
      - name: Track record (published forecasts vs real results)
        run: python -m src.markets.track
      - name: Publish artifacts
        run: |
          mkdir -p markets-data-wt/artifacts
          cp -r artifacts/markets markets-data-wt/artifacts/
          cp -r artifacts/stats markets-data-wt/artifacts/ 2>/dev/null || true
          rm -rf markets-data-wt/artifacts/injuries && cp -r artifacts/injuries markets-data-wt/artifacts/ 2>/dev/null || true
          mkdir -p markets-data-wt/artifacts/results && cp -r artifacts/results/. markets-data-wt/artifacts/results/ 2>/dev/null || true
          mkdir -p markets-data-wt/artifacts/crests && cp -r artifacts/crests/. markets-data-wt/artifacts/crests/ 2>/dev/null || true
          find markets-data-wt/artifacts/injuries -mindepth 1 -maxdepth 1 -type d -mtime +3 -exec rm -rf {} + 2>/dev/null || true
          rm -rf markets-data-wt/artifacts/markets/evaluation markets-data-wt/artifacts/markets/_cache
          cd markets-data-wt
          git config user.name "markets bot"
          git config user.email "markets-bot@users.noreply.github.com"
          git add -A artifacts
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -q -m "markets: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push data HEAD:markets-data
          fi
      - name: Redeploy the Vercel site with the fresh data (only when VERCEL_TOKEN is set; ADR 0060)
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then echo "VERCEL_TOKEN not set: no redeploy"; exit 0; fi
          python scripts/make_vercel_bundle.py --out dist/mac-tahmin
          cd dist/mac-tahmin
          npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" > ../vercel_url.txt
          npx --yes vercel@latest git disconnect --yes --token "$VERCEL_TOKEN" || true   # pushes must not build the repo root
          echo "deployed: $(cat ../vercel_url.txt)"
