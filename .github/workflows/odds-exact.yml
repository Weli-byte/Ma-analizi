name: odds-exact
# Collects EXACT-timestamp odds (The Odds API: provider `last_update` per quote) from GitHub's network,
# because that API host is unreachable from some ISPs (TLS interference seen from Turkey). It spends
# credits only while a collection window is open for a fixture (src/odds/schedule.py), reserving the last
# credits of the month. Quotes are committed to the `odds-data` branch; the owner's PC pulls them with
# `python -m src.odds.run sync-remote`. Needs secrets THE_ODDS_API_KEY and FOOTBALL_DATA_ORG_API_KEY.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the collection windows (spends 2 credits per league)"
        type: boolean
        default: false
concurrency:
  group: odds-exact
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Check out the data branch (create it on the first run)
        run: |
          if git ls-remote --exit-code --heads origin odds-data >/dev/null 2>&1; then
            git fetch origin odds-data
            git worktree add -B odds-data odds-data-wt origin/odds-data
          else
            git worktree add --detach odds-data-wt
            cd odds-data-wt && git checkout --orphan odds-data && git rm -rf . -q
          fi
      - name: Collect exact odds when a window is open
        run: python -m src.odds.run collect-exact --data-root odds-data-wt ${{ inputs.force && '--force' || '' }}
      - name: Commit and push new quotes
        run: |
          cd odds-data-wt
          git config user.name "odds-exact bot"
          git config user.email "odds-exact-bot@users.noreply.github.com"
          git add -A artifacts
          if git diff --cached --quiet; then echo "nothing new"; else
            git commit -q -m "odds: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push origin HEAD:odds-data
          fi
