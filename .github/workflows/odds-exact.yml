name: odds-exact
# Collects EXACT-timestamp odds (The Odds API: provider `last_update` per quote) from GitHub's network,
# because that API host is unreachable from some ISPs (TLS interference seen from Turkey). It spends
# credits only while a collection window is open for a fixture (src/odds/schedule.py), reserving the last
# credits of the month. Quotes are committed to the `odds-data` branch; the owner's PC pulls them with
# `python -m src.odds.run sync-remote`. Self-restarting loop (ADR 0049). Needs secrets THE_ODDS_API_KEY and FOOTBALL_DATA_ORG_API_KEY.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ignore the collection windows (spends 2 credits per league)"
        type: boolean
        default: false
      rounds:
        description: "Collection rounds in this run (10 minutes apart); the next run starts itself afterwards"
        type: string
        default: "5"
concurrency:
  group: odds-exact
  cancel-in-progress: false
permissions:
  contents: write
  actions: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_REPO_URL: git@data-repo:Weli-byte/Ma-analizi2.git
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
      FOOTBALL_DATA_ORG_API_KEY: ${{ secrets.FOOTBALL_DATA_ORG_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Private data repo access (repository-scoped deploy key)
        env:
          DEPLOY_KEY: ${{ secrets.DATA_REPO_DEPLOY_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/data_key && chmod 600 ~/.ssh/data_key
          curl -fsS https://api.github.com/meta | python -c "import json,sys; [print('github.com', k) for k in json.load(sys.stdin)['ssh_keys']]" > ~/.ssh/known_hosts
          cat >> ~/.ssh/config <<'EOF'
          Host data-repo
            HostName github.com
            User git
            IdentityFile ~/.ssh/data_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          git remote add data git@data-repo:Weli-byte/Ma-analizi2.git
      - name: Check out the data branch (create it on the first run)
        run: |
          if git ls-remote --exit-code --heads data odds-data >/dev/null 2>&1; then
            git fetch data odds-data
            git worktree add -B odds-data odds-data-wt data/odds-data
          else
            git worktree add --detach odds-data-wt
            cd odds-data-wt && git checkout --orphan odds-data && git rm -rf . -q
          fi
      - name: Collect every 10 minutes for about 50 minutes (credits are spent only inside a window)
        run: bash scripts/odds_cloud_loop.sh ${{ inputs.rounds || '5' }} 600 ${{ inputs.force && '--force' || '' }}
      - name: Start the next run (self-restart keeps the cadence; set repository variable ODDS_LOOP=off to stop)
        if: always() && vars.ODDS_LOOP != 'off' && !inputs.force
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run odds-exact.yml --ref main
