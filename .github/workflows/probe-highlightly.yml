name: probe-highlightly
# One-off: print the real shape of Highlightly responses (never the key). Removed after use.
on:
  push:
    branches: [feat/highlightly]
    paths: [".github/workflows/probe-highlightly.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          key = os.environ["HIGHLIGHTLY_API_KEY"]
          BASE = "https://soccer.highlightly.net"
          def get(path, **p):
              url = BASE + path + ("?" + urllib.parse.urlencode(p) if p else "")
              last = None
              for hdr in ("x-rapidapi-key", "x-api-key"):
                  req = urllib.request.Request(url, headers={hdr: key})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = json.loads(r.read().decode())
                          rl = {k: v for k, v in r.headers.items() if "limit" in k.lower() or "remaining" in k.lower()}
                          return hdr, r.status, body, rl
                  except urllib.error.HTTPError as e:
                      last = (hdr, e.code, e.read().decode()[:200], {})
                  except Exception as e:
                      last = (hdr, "ERR", type(e).__name__, {})
              return last
          def show(title, res, n=900):
              print("==", title, "->", res[0], res[1], "| rate headers:", res[3] if len(res) > 3 else "")
              print((json.dumps(res[2], ensure_ascii=False)[:n]) if not isinstance(res[2], str) else res[2])
          r = get("/leagues", countryName="Turkey", limit=30)
          ds = r[2].get("data", []) if isinstance(r[2], dict) else []
          print("TURKEY", [(x["id"], x["name"], sorted(y["season"] for y in x["seasons"])[0], sorted(y["season"] for y in x["seasons"])[-1]) for x in ds][:12])
          def wanted(n):
              return {d["displayName"]: d["value"] for d in n["statistics"] if d["displayName"] in ("Corners", "Yellow cards", "Red cards", "Shots on target", "Shots off target", "Expected Goals")}
          for season in (2022, 2023, 2024, 2025):
              r = get("/matches", leagueId=33973, season=season, limit=100, offset=100)
              ms = r[2].get("data", []) if isinstance(r[2], dict) else []
              got = 0
              for m in ms[:4]:
                  st = get("/statistics/" + str(m["id"]))[2]
                  ok = isinstance(st, list) and st and st[0]["statistics"]
                  got += 1 if ok else 0
                  if ok and m is ms[0]:
                      print("SAMPLE", season, m["homeTeam"]["name"], m["awayTeam"]["name"], m["state"]["score"]["current"], wanted(st[0]), wanted(st[1]))
              print("COVERAGE PL", season, "matches with statistics", got, "of", min(4, len(ms)))
          PY
