name: probe-highlightly
# One-off: print the real shape of Highlightly responses (never the key). Removed after use.
on:
  push:
    branches: [feat/highlightly]
    paths: [".github/workflows/probe-highlightly.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.parse, urllib.request
          key = os.environ["HIGHLIGHTLY_API_KEY"]
          BASE = "https://soccer.highlightly.net"
          def get(path, **p):
              url = BASE + path + ("?" + urllib.parse.urlencode(p) if p else "")
              last = None
              for hdr in ("x-rapidapi-key", "x-api-key"):
                  req = urllib.request.Request(url, headers={hdr: key})
                  try:
                      with urllib.request.urlopen(req, timeout=30) as r:
                          body = json.loads(r.read().decode())
                          rl = {k: v for k, v in r.headers.items() if "limit" in k.lower() or "remaining" in k.lower()}
                          return hdr, r.status, body, rl
                  except urllib.error.HTTPError as e:
                      last = (hdr, e.code, e.read().decode()[:200], {})
                  except Exception as e:
                      last = (hdr, "ERR", type(e).__name__, {})
              return last
          def show(title, res, n=900):
              print("==", title, "->", res[0], res[1], "| rate headers:", res[3] if len(res) > 3 else "")
              print((json.dumps(res[2], ensure_ascii=False)[:n]) if not isinstance(res[2], str) else res[2])
          for c, wanted in (("England", "Premier League"), ("Spain", "La Liga"), ("Germany", "Bundesliga"), ("Italy", "Serie A"), ("France", "Ligue 1"), ("Turkey", "Super")):
              r = get("/leagues", countryName=c, limit=30)
              ds = r[2].get("data", []) if isinstance(r[2], dict) else []
              print("LEAGUES", c, [(x["id"], x["name"], sorted(y["season"] for y in x["seasons"])[:1], sorted(y["season"] for y in x["seasons"])[-1:]) for x in ds if wanted.lower().split()[0] in x["name"].lower()][:4], "remaining", r[3].get("x-ratelimit-requests-remaining") if len(r) > 3 else "")
          r = get("/matches", leagueId=33973, season=2025, limit=100, offset=0)
          if isinstance(r[2], dict):
              print("MATCHES keys", list(r[2].keys()), "n", len(r[2].get("data", [])), "pagination", r[2].get("pagination"), "plan", r[2].get("plan"))
              ms = r[2].get("data", [])
              print("first/last", ms[0]["date"] if ms else None, ms[-1]["date"] if ms else None)
          else:
              print("MATCHES", r)
          r2 = get("/matches", leagueId=33973, season=2025, limit=100, offset=100)
          print("PAGE2 n", len(r2[2].get("data", [])) if isinstance(r2[2], dict) else r2)
          old = get("/statistics/898449140")
          show("statistics 2023 match", old, 700)
          old2 = get("/matches", leagueId=33973, season=2019, limit=5)
          print("2019 season matches", json.dumps(old2[2], ensure_ascii=False)[:300] if isinstance(old2[2], dict) else old2)
          PY
