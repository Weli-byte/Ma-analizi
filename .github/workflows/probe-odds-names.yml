name: probe-odds-names
# One-off: print the team names The Odds API uses for the new leagues (1 credit per league; no key in the output).
on:
  push:
    branches: [feat/odds-more-leagues]
    paths: [".github/workflows/probe-odds-names.yml"]
jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      THE_ODDS_API_KEY: ${{ secrets.THE_ODDS_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - run: |
          python - <<'PY'
          import json, os, urllib.parse, urllib.request
          key = os.environ["THE_ODDS_API_KEY"]
          def get(path, **p):
              q = urllib.parse.urlencode({**p, "apiKey": key})
              with urllib.request.urlopen("https://api.the-odds-api.com/v4" + path + "?" + q, timeout=30) as r:
                  return json.loads(r.read().decode()), r.headers.get("x-requests-remaining")
          sports, _ = get("/sports/")
          keys = sorted(s["key"] for s in sports if s["key"].startswith("soccer") and any(w in s["key"] for w in ("germany_bundesliga", "italy_serie_a", "france_ligue_one", "turkey", "epl", "la_liga")))
          print("sport keys:", keys)
          for sk in ("soccer_germany_bundesliga", "soccer_italy_serie_a", "soccer_france_ligue_one", "soccer_turkey_super_league"):
              if sk not in keys:
                  print(sk, "NOT AVAILABLE"); continue
              ev, rem = get("/sports/" + sk + "/odds/", bookmakers="pinnacle,betfair_ex_uk,williamhill", markets="h2h", oddsFormat="decimal", dateFormat="iso")
              names = sorted({n for e in ev for n in (e["home_team"], e["away_team"])})
              print(sk, "events", len(ev), "credits left", rem)
              print("NAMES", json.dumps(names, ensure_ascii=False))
          PY
