name: regenerate-golden
on:
  workflow_dispatch: {}
jobs:
  regenerate:
    # Golden artifacts must be generated on the SAME platform CI verifies them on (Linux) —
    # iterative floating-point fits (Elo's gradient ascent, Poisson's IPF) can differ in the
    # last bit between Windows and Linux libm/BLAS, which is enough to change a SHA256 hash
    # even when every metric value matches to 1e-8. Do not generate golden.json locally on
    # Windows and commit it directly; use this workflow (download the artifact, commit it).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.lock
      - name: Install locked dependencies (hash-verified)
        run: |
          python -m pip install --upgrade pip
          pip install --require-hashes -r requirements.lock
          pip install --no-deps -e .
      - name: Regenerate golden artifacts
        run: python scripts/update_golden.py
      - uses: actions/upload-artifact@v4
        with:
          name: golden-artifacts-${{ github.run_id }}
          path: tests/fixtures/golden/expected/
          retention-days: 7
