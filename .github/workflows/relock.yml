name: relock
# Upstream releases make `lock-up-to-date` (ci.yml) fail on main almost daily (the check compiles from scratch on purpose,
# CLAUDE.md H-05, so it is not loosened). This job regenerates the lock files with the documented command (--upgrade is required)
# and keeps ONE rolling PR (branch chore/relock, force-updated) open while main is stale; it closes that PR when main is
# up to date again. It never merges anything.
# Needs: repo Settings -> Actions -> General -> "Allow GitHub Actions to create and approve pull requests".
# A PR opened or updated by GITHUB_TOKEN gets its `pull_request` ci run parked as "action_required" (a bot is not trusted
# to run workflows). The job approves that run itself (needs `actions: write`), so the normal checks appear on the PR.
# (A workflow_dispatch run on the branch passes too, but its results do NOT attach to the PR: tried 2026-10-19.)
on:
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:
permissions:
  contents: write
  pull-requests: write
  actions: write
jobs:
  relock:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install uv
      - name: Regenerate locks
        run: |
          uv pip compile pyproject.toml --extra dev --universal --generate-hashes --python-version 3.12 --upgrade -o requirements.lock
          uv pip compile requirements-api.in --universal --generate-hashes --python-version 3.12 --upgrade -o requirements-api.lock
          cp requirements.lock tests/fixtures/real_smoke/root/requirements.lock
        shell: bash
      - name: Keep one rolling PR while the locks are stale
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          branch="chore/relock"
          # a lock's header comment names the output path; ignore it like the CI check does
          same() { diff <(git show "$1:$2" | grep -v '^#') <(grep -v '^#' "$2") >/dev/null; }
          open_pr="$(gh pr list --head "$branch" --state open --json number -q '.[0].number // empty')"
          if same HEAD requirements.lock && same HEAD requirements-api.lock; then
            echo "locks already up to date"
            if [ -n "$open_pr" ]; then
              gh pr close "$open_pr" --delete-branch --comment "Locks are up to date on main again; closing."
            fi
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin "$branch" 2>/dev/null || true
          if git rev-parse --verify -q "origin/$branch" >/dev/null \
            && same "origin/$branch" requirements.lock && same "origin/$branch" requirements-api.lock; then
            echo "the rolling PR already carries these locks"; exit 0
          fi
          git checkout -B "$branch"
          git add requirements.lock requirements-api.lock tests/fixtures/real_smoke/root/requirements.lock
          git commit -m "chore: regenerate lock files (relock)"
          git push --force origin "$branch"
          if [ -z "$open_pr" ]; then
            gh pr create --base main --head "$branch" --title "chore: regenerate lock files (relock)" \
              --body "Automatic: upstream releases made the lock files stale. This PR is updated in place; merge it when all ci jobs are green."
          fi
          # approve the parked pull_request run(s) of ci for this branch (they appear a few seconds after the push)
          for attempt in 1 2 3 4 5 6; do
            sleep 10
            ids="$(gh run list --workflow ci.yml --branch "$branch" --event pull_request --json databaseId,conclusion               -q '.[] | select(.conclusion == "action_required") | .databaseId')"
            [ -n "$ids" ] && break
          done
          for id in $ids; do gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null && echo "approved run $id"; done
        shell: bash
