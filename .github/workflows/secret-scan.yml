name: secret-scan
# Secret scanning of the whole git history (ADR 0078): gitleaks, a pinned release whose SHA-256 is checked before it runs. A finding fails the job. The job first proves that the scanner
# really detects a secret (a random canary in a throwaway repository), so a silently broken scan cannot pass for a clean one. The finding text is redacted: a leaked value is never printed.
on:
  push:
    branches: [main]
  pull_request: {}
  schedule:
    - cron: "41 5 * * 1"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  gitleaks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"   # gitleaks_8.30.1_linux_x64.tar.gz, from the release's own checksums file
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Download the pinned gitleaks release and verify its checksum
        run: |
          set -euo pipefail
          curl -fsSL --retry 5 --retry-delay 5 --retry-all-errors -o gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          mkdir -p "$RUNNER_TEMP/gl" && tar -xzf gitleaks.tar.gz -C "$RUNNER_TEMP/gl" gitleaks
          "$RUNNER_TEMP/gl/gitleaks" version
      - name: The scanner must catch a planted secret (canary)
        run: |
          set -u
          d="$(mktemp -d)" && cd "$d" && git init -q
          # gitleaks' generic rule ignores low-entropy values and a random hex string sometimes is one (CI run 40419871168): draw until the entropy is clearly above the rule's threshold
          python3 -c "import math, secrets; f = lambda t: -sum(t.count(c) / 32 * math.log2(t.count(c) / 32) for c in set(t)); t = next(x for x in iter(lambda: secrets.token_hex(16), None) if f(x) >= 3.8); print('api_key = \"' + t + '\"')" > canary.txt
          git add . && git -c user.name=ci -c user.email=ci@example.invalid commit -q -m canary
          if "$RUNNER_TEMP/gl/gitleaks" git . --no-banner --redact --exit-code 1 >/dev/null 2>&1; then
            echo "::error::gitleaks did not flag the canary: the scan is not working"; exit 1
          fi
          echo "canary detected: the scanner works"
      - name: Scan the repository history
        run: '"$RUNNER_TEMP/gl/gitleaks" git . --no-banner --redact --exit-code 1 --verbose'
