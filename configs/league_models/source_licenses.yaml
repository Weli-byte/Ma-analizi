# Data-source licence manifest for the league-based model programme (Sprint 1, ADR 0063).
# Every right is explicit: ALLOWED | DENIED | UNKNOWN. UNKNOWN is NEVER permission (it blocks production training).
# Facts below are copied from the repository's own evidence (docs/data_sources/*.md, ADRs); nothing is newly researched here.
# NOT LEGAL ADVICE. `plan_status` is the programme's decision, which can be stricter than the raw terms:
#   PERMITTED    all rights needed for production training and display are ALLOWED
#   CONDITIONAL  usable only under the stated conditions; some right is UNKNOWN
#   RESEARCH_ONLY  rights not granted; may inform offline research, never a production model
#   BLOCKED      plan red line: no collection, no training, no evaluation input for league models
