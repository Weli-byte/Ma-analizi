# S15 value analytics (ADR 0030) + bet suggestions (ADR 0039). The system never places a bet; the owner decides.
# A paper bet needs an ELIGIBLE value row (all three 1X2 quotes timestamp_quality=exact, observed
# after the forecast and before kickoff) with edge and EV at or above these thresholds.
min_edge: 0.05      # model probability minus de-vigged market probability
min_ev: 0.05        # expected profit per unit staked at the offered price
stake_units: 1.0    # paper stake, in abstract units
leagues: ["PL", "PD"]   # ESPN collection codes (src/odds/espn.py LEAGUE_CODES)
odds_api_reserve_credits: 25   # The Odds API free plan: 500 credits/month, 2 per league call
exact_horizon_hours: 26         # collect exact odds only for fixtures kicking off within this horizon
# bookmaker KEYS to request (max 10 = a single credit per call, instead of every bookmaker of the uk/eu
# regions: 2 credits and ~120 quotes per event). pinnacle is the sharp reference.
odds_api_bookmakers: [pinnacle, betfair_ex_uk, williamhill, ladbrokes_uk, skybet, unibet_uk, betway, coral]
kelly_fraction: 0.25   # suggestions: quarter Kelly (full Kelly is far too aggressive with uncertain probabilities)
max_stake_pct: 2.0     # suggestions: stake hint never above this percent of bankroll
exact_leagues: [PL, PD, BL1, SA, FL1, TR]   # The Odds API (cloud). TR has no free fixture schedule: see odds_only_interval_hours
odds_only_interval_hours: 12   # TR: one call per 12 h (about 60 credits/month) instead of fixture windows
