# Only env var NAMES here. Real keys live in environment / .env (gitignored).
# Every enabled provider makes REAL API calls; there is no mock/fake provider (ADR 0024).
# A provider is operational only after `python -m src.llm.live_smoke` received a real response.
budget:                       # enforced BEFORE any call; exceeding it fails without calling
  max_requests_per_run: 60      # owner-approved 2026-10-02: 20 matches x 3 providers
  max_total_tokens: 500000
  max_estimated_cost_usd: 0.15   # WORST-CASE bound (all retries, full output); expected real cost ~0.03
  max_concurrency: 1
  request_timeout_seconds: 30
  retry_limit: 2
  max_output_tokens: 800      # per request; covers reasoning/thinking tokens too
providers:
  openai:    {enabled: true,  api_key_env: OPENAI_API_KEY,    model: gpt-6-luna}
  anthropic: {enabled: false, api_key_env: ANTHROPIC_API_KEY, model: TBD}
  gemini:    {enabled: true,  api_key_env: GEMINI_API_KEY,    model: gemini-3.1-flash-lite}
  groq:      {enabled: true,  api_key_env: GROQ_API_KEY,      model: openai/gpt-oss-20b}
