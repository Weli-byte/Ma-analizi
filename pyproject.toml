[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "football-forecasting"
version = "0.1.0"
description = "Global Football Forecasting Benchmark & Intelligence Platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.6,<3",
    "pyyaml>=6",
    "numpy>=1.26",
    "duckdb>=1.0",
    "tzdata",
    "pytz",
    "xgboost>=2",
    "lightgbm>=4",
    "optuna>=3",
    "shap>=0.44",
    "scipy>=1.11",  # was already transitive (shap/scikit-learn); promoted to direct for
    # EloModel's scipy.optimize.minimize fit (S0-S7 hardening Phase 6, ADR-0013 amendment)
    "numba>=0.60",  # shap's transitive dep; pinned up so uv's universal resolver doesn't pick
    "llvmlite>=0.43",  # an ancient numba/llvmlite pair that predates our numpy/python versions
    "scikit-learn>=1.3",  # was already transitive (shap); promoted to direct for S11's logistic
    # stacking ensemble (src/evaluation/ensemble.py, ADR-0022)
    "openai>=2",  # official SDKs for the REAL provider adapters (src/llm/providers/, ADR-0024);
    "anthropic>=0.100",  # replaces the urllib adapters + mocked tests
    "google-genai>=1",
    "groq>=0.30",  # free-tier third provider (ADR 0025)
    "fastapi>=0.115",  # S18 public API (src/api/, ADR 0035)
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "httpx>=0.27"]  # httpx: fastapi TestClient

[tool.setuptools.packages.find]
include = ["src*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --basetemp=.pytest_tmp -m \"not live\""
markers = ["live: makes REAL provider API calls (costs money); run with: pytest -m live tests/integration"]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "notebooks"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
"src/dashboard/*" = ["E501"]  # inline CSS and wide table headers
"src/markets/*" = ["E501"]  # wide dict literals

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.coverage.run]
# These adapters only run against the providers' real servers. They are verified by the REAL-API
# tests (`pytest -m live tests/integration`, workflow live-ai.yml), which normal CI deliberately does
# not run (no keys, per-call cost); mocking them to inflate a percentage is forbidden (ADR 0024).
omit = [
    "src/llm/providers/openai_provider.py",
    "src/llm/providers/gemini_provider.py",
    "src/llm/providers/anthropic_provider.py",
    "src/llm/providers/groq_provider.py",
]
